# Nginx in front of Keystead, for deployments that already run it.
#
# Caddy is the simpler option (see Caddyfile) because it handles certificates itself. This is
# here for an existing Nginx estate.

server {
    listen 80;
    server_name keystead.example.com;

    # Nothing is served without TLS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name keystead.example.com;

    ssl_certificate     /etc/letsencrypt/live/keystead.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keystead.example.com/privkey.pem;

    # TLS 1.2 is the floor, as the specification requires.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:keystead:10m;
    ssl_session_tickets off;

    # Keystead enforces its own body limit; this stops a large upload reaching it at all.
    client_max_body_size 2m;

    location / {
        proxy_pass http://keystead:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keystead trusts these headers only from the networks named in
        # Keystead__ReverseProxy__KnownNetworks. Set that to this proxy's address, or the IP
        # allowlist and the per-address rate limits can be spoofed by any client.

        # Keystead sets its own security headers, including a strict nonce CSP. Do not add or
        # rewrite any of them here: injecting a second CSP would break the nonce and block the
        # application's own scripts.
        proxy_hide_header X-Powered-By;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
